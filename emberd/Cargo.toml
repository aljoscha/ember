[package]
name = "emberd"
version = "0.1.0"
edition = "2021"
description = "Lightweight in-VM daemon for Ember VMs"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["socket"] }

[dev-dependencies]
tempfile = "3"
