[package]
name = "ember-linux"
version = "0.1.0"
edition = "2021"
description = "Linux backend for ember: Firecracker + ZFS + TAP/iptables"

[lints]
workspace = true

[dependencies]
ember-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
hyperlocal = { workspace = true }
nix = { workspace = true, features = ["fs", "ioctl", "net", "signal", "process", "user"] }
anyhow = { workspace = true }
uuid = { workspace = true }
tempfile = { workspace = true }
rand = { workspace = true }
