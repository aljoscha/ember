[package]
name = "ember-macos"
version = "0.1.0"
edition = "2021"
description = "macOS backend for ember: Apple Virtualization Framework + APFS clones + vmnet"

[dependencies]
ember-core = { path = "../ember-core" }

# System (signals, process management)
nix = { version = "0.29", features = ["fs", "signal", "process", "user"] }

# Error handling
anyhow = "1"

# Temporary directories
tempfile = "3"
