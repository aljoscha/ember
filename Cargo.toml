[workspace]
members = ["crates/ember-core", "crates/ember-linux", "crates/ember-macos"]
default-members = ["."]

[workspace.lints.clippy]
mod_module_files = "warn"

[workspace.dependencies]
# Internal crates
ember-core = { path = "crates/ember-core" }
ember-linux = { path = "crates/ember-linux" }
ember-macos = { path = "crates/ember-macos" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Error handling
anyhow = "1"
thiserror = "2"

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# CLI
clap = { version = "4.5", features = ["derive"] }

# System (features vary per crate — declared without features here)
nix = "0.29"

# SSH
russh = "0.46"
russh-keys = "0.46"

# HTTP (Firecracker API)
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
http-body-util = "0.1"
hyperlocal = "0.9"

# Identifiers
uuid = { version = "1", features = ["v4", "serde"] }

# Temporary directories
tempfile = "3"

# Randomness (dm-thin volume id allocation)
rand = "0.8"

[package]
name = "ember"
version = "0.1.0"
edition = "2021"
description = "Lightweight VM manager with copy-on-write storage"
license = "MIT"

[lints]
workspace = true

[package.metadata.deb]
maintainer = "Aljoscha Krettek <aljoscha.krettek@gmail.com>"
copyright = "2026, ember authors"
license-file = ["LICENSE", "0"]
extended-description = """\
Ember is a lightweight CLI for managing microVMs with copy-on-write storage.
On Linux it uses Firecracker (KVM) for VMs and ZFS zvols for storage. \
No daemon, no REST API — just a single binary."""
section = "admin"
priority = "optional"
depends = "$auto, zfsutils-linux, iptables, iproute2, curl, skopeo"
assets = [
    ["target/release/ember", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/ember/README", "644"],
    ["LICENSE", "usr/share/doc/ember/LICENSE", "644"],
]

[dependencies]
ember-core = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
nix = { workspace = true, features = ["user"] }
anyhow = { workspace = true }
uuid = { workspace = true }
tempfile = { workspace = true }

# Platform-specific backends
[target.'cfg(target_os = "linux")'.dependencies]
ember-linux = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
ember-macos = { workspace = true }
