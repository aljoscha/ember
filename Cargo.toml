[workspace]
members = ["crates/ember-core", "crates/ember-linux", "crates/ember-macos"]
default-members = ["."]

[package]
name = "ember"
version = "0.1.0"
edition = "2021"
description = "Lightweight VM manager with copy-on-write storage"
license = "MIT"

[dependencies]
# Core library (shared types, traits, utilities)
ember-core = { path = "crates/ember-core" }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Serialization
serde_json = "1.0"

# Async runtime (SSH in exec/cp commands)
tokio = { version = "1", features = ["full"] }

# System (root check via geteuid)
nix = { version = "0.29", features = ["user"] }

# Error handling
anyhow = "1"

# Identifiers
uuid = { version = "1", features = ["v4", "serde"] }

# Temporary directories
tempfile = "3"

# Platform-specific backends
[target.'cfg(target_os = "linux")'.dependencies]
ember-linux = { path = "crates/ember-linux" }

[target.'cfg(target_os = "macos")'.dependencies]
ember-macos = { path = "crates/ember-macos" }
