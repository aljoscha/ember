[package]
name = "ember"
version = "0.1.0"
edition = "2021"
description = "Lightweight Firecracker VM manager with ZFS-backed storage"
license = "MIT"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP over Unix socket (Firecracker API)
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
http-body-util = "0.1"
hyperlocal = "0.9"

# System (TAP ioctl, signals, process management)
nix = { version = "0.29", features = ["fs", "ioctl", "net", "signal", "process", "user"] }

# SSH
russh = "0.46"
russh-keys = "0.46"

# Error handling
thiserror = "2"
anyhow = "1"

# Identifiers
uuid = { version = "1", features = ["v4", "serde"] }

# Progress display
indicatif = "0.17"

# Temporary directories
tempfile = "3"
